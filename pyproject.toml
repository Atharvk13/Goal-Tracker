[project]
name = "goal-tracker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.9",
    "langchain-ollama>=1.1.0",
    "platformdirs>=4.14.5",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "rich>=15.0.0",
    "typer>=0.29.0",
    "tzdata>=2026.6",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/goal_tracker"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
[project.scripts]
goal-tracker = "goal_tracker.cli.app:app"
