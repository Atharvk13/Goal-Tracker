<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <script>
        // Apply the saved light/dark choice before the page paints (no flash).
        try {
            const saved = localStorage.getItem("gt-theme");
            if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
        } catch {}
    </script>
    <title>{% block title %}Goal Tracker{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='10' fill='%232455bd'/%3E%3Ccircle cx='12' cy='12' r='6' fill='white'/%3E%3Ccircle cx='12' cy='12' r='2.5' fill='%232455bd'/%3E%3C/svg%3E">
    <style>
        /* ---------- Design tokens ---------- */
        :root {
            --bg: #f4f6fa;
            --surface: #ffffff;
            --surface-2: #f8fafc;
            --text: #172033;
            --muted: #52627a;
            --border: #dce3ed;
            --border-soft: #e7ebf2;
            --input-border: #aab6c8;
            --accent: #2455bd;
            --accent-hover: #1c449a;
            --accent-soft: #eef3fd;
            --on-accent: #ffffff;
            --accent-2: #7c3aed;
            --glow: rgba(36, 85, 189, 0.12);

            --ok-bg: #e7f6ed;    --ok-fg: #1d6b3d;
            --info-bg: #eef6ff;  --info-fg: #1d4670;  --info-border: #9bbfd9;
            --warn-bg: #fff8e6;  --warn-fg: #6b4d00;  --warn-border: #e0c27a;
            --err-bg: #fff1f1;   --err-fg: #872323;   --err-border: #d99b9b;
            --neutral-bg: #eef2f8; --neutral-fg: #45546c;

            --radius: 14px;
            --shadow: 0 1px 2px rgba(23, 32, 51, 0.04), 0 6px 20px rgba(23, 32, 51, 0.05);
        }

        /* Dark theme: follows Windows unless the toggle chose light or dark. */
        :root[data-theme="light"] { color-scheme: light; }
        :root[data-theme="dark"] { color-scheme: dark; }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #0f1420;
                --surface: #171d2b;
                --surface-2: #1d2433;
                --text: #e6eaf2;
                --muted: #9ca8bc;
                --border: #2a3346;
                --border-soft: #232b3c;
                --input-border: #3d4862;
                --accent: #7ea4ff;
                --accent-hover: #a0bcff;
                --accent-soft: #1c2947;
                --on-accent: #0f1420;
                --accent-2: #b58cff;
                --glow: rgba(126, 164, 255, 0.10);

                --ok-bg: #12301f;    --ok-fg: #8fe0ad;
                --info-bg: #15243d;  --info-fg: #aac9f5;  --info-border: #2d4a75;
                --warn-bg: #2d2510;  --warn-fg: #f0d48a;  --warn-border: #6b5620;
                --err-bg: #33171a;   --err-fg: #f3a7a7;   --err-border: #6e2b30;
                --neutral-bg: #232b3c; --neutral-fg: #b8c2d4;

                --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
            }
        }

        :root[data-theme="dark"] {
            --bg: #0f1420;
            --surface: #171d2b;
            --surface-2: #1d2433;
            --text: #e6eaf2;
            --muted: #9ca8bc;
            --border: #2a3346;
            --border-soft: #232b3c;
            --input-border: #3d4862;
            --accent: #7ea4ff;
            --accent-hover: #a0bcff;
            --accent-soft: #1c2947;
            --on-accent: #0f1420;
            --accent-2: #b58cff;
            --glow: rgba(126, 164, 255, 0.10);

            --ok-bg: #12301f;    --ok-fg: #8fe0ad;
            --info-bg: #15243d;  --info-fg: #aac9f5;  --info-border: #2d4a75;
            --warn-bg: #2d2510;  --warn-fg: #f0d48a;  --warn-border: #6b5620;
            --err-bg: #33171a;   --err-fg: #f3a7a7;   --err-border: #6e2b30;
            --neutral-bg: #232b3c; --neutral-fg: #b8c2d4;

            --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }

        /* Light/dark toggle in the top right corner */
        .theme-toggle {
            display: inline-grid;
            place-items: center;
            width: 40px;
            height: 40px;
            margin-left: 8px;
            padding: 0;
            border-radius: 50%;
            background: var(--surface-2);
            color: var(--text);
            box-shadow: inset 0 0 0 1px var(--border);
        }
        .theme-toggle:hover { background: var(--accent-soft); color: var(--accent); }
        .theme-toggle:not(:disabled):hover { box-shadow: inset 0 0 0 1px var(--accent); }
        .theme-toggle svg { grid-area: 1 / 1; transition: transform 0.45s cubic-bezier(.2,.8,.2,1), opacity 0.3s ease; }
        .theme-toggle .moon { opacity: 0; transform: rotate(-90deg) scale(0.5); }
        .theme-toggle.is-dark .sun { opacity: 0; transform: rotate(90deg) scale(0.5); }
        .theme-toggle.is-dark .moon { opacity: 1; transform: none; }
        html.theme-switching, html.theme-switching * { transition: background-color 0.35s ease, color 0.35s ease, border-color 0.35s ease !important; }

        /* ---------- Base ---------- */
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            color: var(--text);
            background: var(--bg);
            line-height: 1.5;
        }

        main {
            width: min(100% - 32px, 760px);
            margin: 40px auto 64px;
        }

        main.medium { width: min(100% - 32px, 880px); }
        main.wide { width: min(100% - 32px, 1080px); }

        a { color: var(--accent); text-underline-offset: 3px; }
        a:hover { color: var(--accent-hover); }

        :focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 3px;
        }

        h1 { margin: 12px 0 8px; letter-spacing: -0.02em; overflow-wrap: anywhere; }
        h2 { letter-spacing: -0.01em; }
        code { font-size: 0.85em; }

        /* ---------- Site navigation ---------- */
        .site-header {
            position: sticky;
            top: 0;
            z-index: 10;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }

        .site-header nav {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px 6px;
            width: min(100% - 32px, 1080px);
            margin: 0 auto;
            padding: 10px 0;
        }

        .site-header a {
            padding: 8px 12px;
            border-radius: 8px;
            color: var(--muted);
            font-weight: 600;
            text-decoration: none;
        }

        .site-header a:hover { color: var(--text); background: var(--surface-2); }

        .site-header a[aria-current="page"] {
            color: var(--accent);
            background: var(--accent-soft);
        }

        .site-header .brand {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-right: auto;
            padding-left: 0;
            color: var(--text);
            font-size: 1.05rem;
        }

        .site-header .brand:hover,
        .site-header .brand[aria-current="page"] { background: none; color: var(--text); }
        .site-header .brand svg { color: var(--accent); }

        .site-footer {
            width: min(100% - 32px, 1080px);
            margin: 0 auto 32px;
            color: var(--muted);
            font-size: 0.85rem;
        }

        /* ---------- Text ---------- */
        .intro, .hint, dt, .metadata, .muted { color: var(--muted); }
        .intro, .hint, dt, .metadata { line-height: 1.6; }

        .hint { margin: 6px 0 0; font-size: 0.9rem; }
        .metadata { margin: 6px 0; font-size: 0.9rem; }
        .description { white-space: pre-wrap; line-height: 1.6; }

        dt { margin-top: 18px; font-weight: 600; }

        dd {
            margin: 5px 0 0;
            white-space: pre-wrap;
            line-height: 1.6;
        }

        .quote {
            margin: 6px 0;
            padding-left: 10px;
            border-left: 3px solid var(--border);
            color: var(--muted);
            font-style: italic;
            font-size: 0.92rem;
        }

        ul.plain { margin: 0; padding-left: 20px; }
        ul.plain li { margin-bottom: 6px; line-height: 1.5; }

        /* ---------- Badges ---------- */
        .status, .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 999px;
            background: var(--neutral-bg);
            color: var(--neutral-fg);
            font-size: 0.8rem;
            font-weight: 600;
            line-height: 1.5;
            vertical-align: middle;
            white-space: nowrap;
        }

        .badge-completed, .badge-done, .badge-active, .badge-exported, .badge-on_track {
            background: var(--ok-bg); color: var(--ok-fg);
        }
        .badge-in_progress { background: var(--info-bg); color: var(--info-fg); }
        .badge-pending, .badge-missing, .badge-not_started, .badge-at_risk {
            background: var(--warn-bg); color: var(--warn-fg);
        }
        .badge-overdue, .badge-failed { background: var(--err-bg); color: var(--err-fg); }
        .badge-independent { background: var(--accent-soft); color: var(--accent); }

        /* ---------- Panels and layout ---------- */
        .card, form.panel {
            margin-top: 24px;
            padding: 24px 28px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow-wrap: anywhere;
        }

        .card h2, form.panel h2 { margin-top: 0; font-size: 1.2rem; }
        .card h3 { font-size: 1.02rem; margin: 20px 0 8px; }
        .section-title { margin: 28px 0 12px; font-size: 1.1rem; }

        .page-header {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            justify-content: space-between;
            gap: 16px;
        }

        .card-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        .card-header h2 { margin: 0; }

        .actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 16px;
            margin-top: 28px;
        }

        .actions.tight { margin-top: 0; gap: 10px; }
        .actions form { margin: 0; }
        form.panel .actions { margin-top: 8px; }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 0 20px;
        }

        .row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 0 20px;
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 12px 16px;
            margin-top: 20px;
        }

        .filters .field { margin: 0; }
        .filters input, .filters select { width: auto; }

        .pagination {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
            color: var(--muted);
        }

        .tabs { display: flex; gap: 4px; }

        .tabs a {
            padding: 6px 12px;
            border-radius: 8px;
            color: var(--muted);
            font-weight: 600;
            text-decoration: none;
        }

        .tabs a[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }

        /* ---------- Messages ---------- */
        .error, .errors, .notice, .warning {
            margin: 16px 0;
            padding: 14px 16px;
            border: 1px solid;
            border-radius: 10px;
            line-height: 1.6;
        }

        .error, .errors { border-color: var(--err-border); background: var(--err-bg); color: var(--err-fg); }
        .notice { border-color: var(--info-border); background: var(--info-bg); color: var(--info-fg); }
        .warning { border-color: var(--warn-border); background: var(--warn-bg); color: var(--warn-fg); }
        .warning a, .errors a, .notice a { color: inherit; }
        .warning ul, .errors ul { margin: 8px 0 0; padding-left: 24px; }

        /* ---------- Forms ---------- */
        .field { margin-bottom: 20px; }

        label, .label-text {
            display: block;
            margin: 0 0 8px;
            font-weight: 600;
        }

        input, select, textarea {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid var(--input-border);
            border-radius: 8px;
            font: inherit;
            background: var(--surface);
            color: inherit;
        }

        input:focus, select:focus, textarea:focus { border-color: var(--accent); }

        textarea { min-height: 100px; resize: vertical; }

        input[type="checkbox"], input[type="radio"] {
            width: auto;
            margin: 3px 10px 0 0;
            accent-color: var(--accent);
        }

        .checks label, label.inline {
            display: flex;
            align-items: flex-start;
            margin: 0 0 8px;
            font-weight: 400;
        }

        .checks label.nested { margin-left: 28px; font-size: 0.93rem; color: var(--muted); }
        .goal-choice { padding: 8px 0; border-top: 1px solid var(--border-soft); }
        .goal-choice:first-of-type { border-top: 0; }

        fieldset {
            margin: 0 0 22px;
            padding: 16px 20px;
            border: 1px solid var(--border);
            border-radius: 12px;
        }

        fieldset.item { background: var(--surface-2); }
        legend { padding: 0 6px; font-weight: 700; }

        button, a.button {
            display: inline-block;
            padding: 11px 20px;
            border: 0;
            border-radius: 8px;
            background: var(--accent);
            color: var(--on-accent);
            font: inherit;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        button:hover, a.button:hover { background: var(--accent-hover); color: var(--on-accent); }
        button:disabled { opacity: 0.65; cursor: progress; }

        button.secondary, a.button.secondary {
            background: transparent;
            color: var(--accent);
            box-shadow: inset 0 0 0 1px var(--accent);
        }

        button.secondary:hover, a.button.secondary:hover { background: var(--accent-soft); color: var(--accent); }

        /* ---------- Tables ---------- */
        .table-wrap { overflow-x: auto; }

        table.data {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }

        table.data th, table.data td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-soft);
            text-align: left;
            vertical-align: top;
        }

        table.data th {
            color: var(--muted);
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        table.data tbody tr:hover { background: var(--surface-2); }
        table.data tr.subrow td { padding-top: 0; color: var(--muted); font-size: 0.9rem; border-bottom-style: dashed; }
        table.data td.num, table.data th.num { text-align: right; white-space: nowrap; }

        /* ---------- Metrics ---------- */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin-top: 24px;
        }

        .stat {
            display: block;
            padding: 18px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: var(--shadow);
            color: inherit;
            text-decoration: none;
        }

        a.stat.link:hover { border-color: var(--accent); color: inherit; }
        .stat .value { display: block; font-size: 1.6rem; font-weight: 700; letter-spacing: -0.02em; }
        .stat .label { display: block; margin-bottom: 8px; color: var(--muted); font-size: 0.85rem; }

        .bar {
            height: 8px;
            border-radius: 999px;
            background: var(--border-soft);
            overflow: hidden;
            min-width: 80px;
        }

        .bar span { display: block; height: 100%; border-radius: 999px; background: var(--accent); }
        .bar-row { display: flex; align-items: center; gap: 10px; }
        .bar-row .bar { flex: 1; }
        .bar-row > span:last-child { min-width: 56px; text-align: right; font-variant-numeric: tabular-nums; }

        /* ---------- Report details ---------- */
        .goal-result { padding: 16px 0; border-top: 1px solid var(--border-soft); }
        .goal-result:first-of-type { border-top: 0; padding-top: 0; }
        .goal-result h3 { margin: 0 0 4px; }

        .milestone-list { list-style: none; margin: 10px 0; padding: 0; }
        .milestone-list li { padding: 4px 0; }
        .milestone-list li span[aria-hidden] { display: inline-block; width: 22px; color: var(--muted); }
        .milestone-list li.done span[aria-hidden] { color: var(--ok-fg); font-weight: 700; }

        ul.advice { padding-left: 20px; }
        ul.advice > li { margin-bottom: 12px; }
        ul.advice details { margin-top: 4px; color: var(--muted); font-size: 0.9rem; }
        ul.advice summary { cursor: pointer; }

        .period-line { margin: 20px 0 0; }

        /* ---------- Daily mail ---------- */
        .mail-field { margin-bottom: 20px; }
        .mail-field .label-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 8px;
        }
        .mail-field label { margin: 0; }
        .mail-body {
            min-height: 380px;
            font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
            font-size: 0.92rem;
            line-height: 1.55;
        }
        button.small { padding: 6px 14px; font-size: 0.9rem; }
        .badge-sent { background: var(--ok-bg); color: var(--ok-fg); }
        .badge-sending { background: var(--info-bg); color: var(--info-fg); }
        .recipients { margin: 0; }
        .recipients dt { margin-top: 6px; }
        pre.mail-preview {
            margin: 8px 0 0;
            white-space: pre-wrap;
            font-size: 0.85rem;
            color: var(--muted);
        }


        /* ---------- Motion & cursor effects ---------- */
        main, .site-footer { position: relative; z-index: 1; }

        .site-header {
            animation: slide-down 0.5s cubic-bezier(.2,.8,.2,1) both;
            transition: box-shadow 0.25s ease;
        }
        .site-header.scrolled { box-shadow: 0 8px 24px rgba(23, 32, 51, 0.10); }

        /* Animated underline on the menu links */
        .site-header nav > a.nav-link { position: relative; transition: color 0.2s, background 0.2s; }
        .site-header nav > a.nav-link::after {
            content: "";
            position: absolute;
            left: 12px; right: 12px; bottom: 4px;
            height: 2px;
            border-radius: 2px;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.3s cubic-bezier(.2,.8,.2,1);
        }
        .site-header nav > a.nav-link:hover::after,
        .site-header nav > a.nav-link[aria-current="page"]::after { transform: scaleX(1); }

        .site-header .brand svg { transition: transform 0.6s cubic-bezier(.2,.8,.2,1); }
        .site-header .brand:hover svg { transform: rotate(180deg) scale(1.1); }

        /* Daily mail: separate button in the top right corner */
        .site-header a.mail-cta {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-left: 14px;
            padding: 9px 18px;
            border-radius: 999px;
            color: #fff;
            background: linear-gradient(135deg, #2455bd, #7c3aed);
            background-size: 200% 200%;
            box-shadow: 0 6px 18px rgba(80, 70, 220, 0.35);
            overflow: hidden;
            animation: gradient-shift 6s ease infinite, pop-in 0.6s 0.2s cubic-bezier(.2,1.4,.4,1) both;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            will-change: transform;
        }
        .site-header a.mail-cta:hover {
            color: #fff;
            background: linear-gradient(135deg, #2455bd, #7c3aed);
            background-size: 200% 200%;
            box-shadow: 0 10px 26px rgba(80, 70, 220, 0.5);
        }
        .site-header a.mail-cta::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,0.45) 50%, transparent 70%);
            transform: translateX(-120%);
            transition: transform 0.7s ease;
        }
        .site-header a.mail-cta:hover::before { transform: translateX(120%); }
        .site-header a.mail-cta:hover svg { animation: wiggle 0.6s ease; }
        .site-header a.mail-cta[aria-current="page"] {
            box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--accent-2), 0 8px 22px rgba(80, 70, 220, 0.4);
        }
        .site-header a.mail-cta span, .site-header a.mail-cta svg { position: relative; }

        /* Page entrance */
        main > h1, main > .intro, main > a:first-child, main > header, main > .page-header {
            animation: fade-up 0.55s cubic-bezier(.2,.8,.2,1) both;
        }
        main > .intro { animation-delay: 0.08s; }

        /* Cards: reveal on scroll, lift on hover, spotlight follows the cursor */
        .card, form.panel, .stat {
            position: relative;
            transition: transform 0.25s cubic-bezier(.2,.8,.2,1), box-shadow 0.25s ease, border-color 0.25s ease;
        }
        .card:hover, form.panel:hover, .stat:hover {
            transform: translateY(-3px);
            box-shadow: 0 2px 4px rgba(23,32,51,0.05), 0 14px 32px rgba(23,32,51,0.10);
        }
        .card::after, form.panel::after, .stat::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            background: radial-gradient(420px circle at var(--mx, 50%) var(--my, 50%), var(--glow), transparent 45%);
        }
        .card:hover::after, form.panel:hover::after, .stat:hover::after { opacity: 1; }

        .reveal { opacity: 0; transform: translateY(18px); }
        .reveal.visible {
            opacity: 1;
            transform: none;
            transition: opacity 0.6s ease, transform 0.6s cubic-bezier(.2,.8,.2,1), box-shadow 0.25s ease, border-color 0.25s ease;
            transition-delay: var(--delay, 0s), var(--delay, 0s), 0s, 0s;
        }
        .reveal.visible:hover { transform: translateY(-3px); transition-delay: 0s; }

        /* Buttons: press feedback and a ripple from the click point */
        button, a.button { position: relative; overflow: hidden; transition: background 0.15s ease, transform 0.12s ease, box-shadow 0.2s ease; }
        button:not(:disabled):hover, a.button:hover { box-shadow: 0 6px 16px rgba(36, 85, 189, 0.25); }
        button:not(:disabled):active, a.button:active { transform: scale(0.97); }
        .ripple {
            position: absolute;
            width: 12px; height: 12px;
            margin: -6px 0 0 -6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.55);
            pointer-events: none;
            animation: ripple 0.6s ease-out forwards;
        }

        .bar span { animation: grow 1s cubic-bezier(.2,.8,.2,1) both; transform-origin: left; }

        /* Cursor: futuristic HUD. A neon light trail follows the pointer,
           corner brackets track it and lock onto whatever you hover, and a
           clicked spot sends out a hexagon shockwave. The normal cursor stays. */
        :root { --hud: #00d5ff; --hud-2: #a855f7; }
        .cursor-glow, .cursor-trail, .cursor-hud {
            position: fixed;
            top: 0; left: 0;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .cursor-glow {
            z-index: 0;
            width: 560px; height: 560px;
            margin: -280px 0 0 -280px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--glow), transparent 65%);
        }
        .cursor-trail { z-index: 99; width: 100vw; height: 100vh; }
        .cursor-hud {
            z-index: 100;
            width: 28px; height: 28px;
            transition: opacity 0.3s ease;
            will-change: transform, width, height;
        }
        .cursor-hud i {
            position: absolute;
            width: 9px; height: 9px;
            border: 2px solid var(--hud);
            filter: drop-shadow(0 0 4px var(--hud));
            transition: border-color 0.2s ease, width 0.2s ease, height 0.2s ease;
        }
        .cursor-hud i:nth-child(1) { top: 0; left: 0; border-right: 0; border-bottom: 0; }
        .cursor-hud i:nth-child(2) { top: 0; right: 0; border-left: 0; border-bottom: 0; }
        .cursor-hud i:nth-child(3) { bottom: 0; left: 0; border-right: 0; border-top: 0; }
        .cursor-hud i:nth-child(4) { bottom: 0; right: 0; border-left: 0; border-top: 0; }
        .cursor-hud b {
            position: absolute;
            left: 50%; top: 50%;
            width: 4px; height: 4px;
            margin: -2px 0 0 -2px;
            background: var(--hud);
            box-shadow: 0 0 8px var(--hud);
            transform: rotate(45deg);
            transition: opacity 0.2s ease;
        }
        .cursor-hud .scan {
            position: absolute;
            left: 3px; right: 3px; top: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--hud-2), transparent);
            opacity: 0;
        }
        .cursor-hud .label {
            position: absolute;
            left: 0; top: -18px;
            font: 700 9px/1 ui-monospace, Consolas, monospace;
            letter-spacing: 0.12em;
            color: var(--hud);
            text-shadow: 0 0 6px var(--hud);
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        body.cursor-on .cursor-glow, body.cursor-on .cursor-trail, body.cursor-on .cursor-hud { opacity: 1; }
        body.cursor-hover .cursor-hud i { border-color: var(--hud-2); filter: drop-shadow(0 0 5px var(--hud-2)); width: 12px; height: 12px; }
        body.cursor-hover .cursor-hud b { opacity: 0; }
        body.cursor-hover .cursor-hud .scan { opacity: 0.9; animation: hud-scan 1.4s linear infinite; }
        body.cursor-hover .cursor-hud .label { opacity: 1; }
        body.cursor-down .cursor-hud i { width: 6px; height: 6px; }
        body:not(.cursor-hover) .cursor-hud { animation: hud-breathe 2.4s ease-in-out infinite; }
        @keyframes hud-scan { 0% { top: 3px; } 50% { top: calc(100% - 5px); } 100% { top: 3px; } }
        @keyframes hud-breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }

        /* Footer */
        .site-footer { text-align: center; padding-top: 8px; }
        .site-footer .jai {
            display: inline-block;
            font-size: 1.05rem;
            font-weight: 800;
            letter-spacing: 0.02em;
            background: linear-gradient(90deg, var(--accent), var(--accent-2), #e0457b, var(--accent));
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: shine 5s linear infinite, float 3s ease-in-out infinite;
        }

        @keyframes slide-down { from { transform: translateY(-100%); } to { transform: none; } }
        @keyframes fade-up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
        @keyframes pop-in { from { opacity: 0; transform: scale(0.7); } to { opacity: 1; transform: none; } }
        @keyframes gradient-shift { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
        @keyframes wiggle { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-14deg); } 75% { transform: rotate(14deg); } }
        @keyframes ripple { to { transform: scale(28); opacity: 0; } }
        @keyframes grow { from { transform: scaleX(0); } }
        @keyframes shine { to { background-position: 300% 0; } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

        /* Touch screens get no pointer effects; respect reduced motion. */
        @media (hover: none), (pointer: coarse) {
            .cursor-glow, .cursor-trail, .cursor-hud { display: none; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
            .reveal { opacity: 1; transform: none; }
            .cursor-trail, .cursor-hud { display: none; }
        }
        @media (max-width: 560px) {
            .site-header a.mail-cta { margin-left: 0; }
        }

        @media (max-width: 560px) {
            .card, form.panel { padding: 18px; }
            main { margin-top: 24px; }
        }
    </style>
    {% block styles %}{% endblock %}
</head>
<body>
    <div class="cursor-glow" aria-hidden="true"></div>
    <canvas class="cursor-trail" aria-hidden="true"></canvas>
    <div class="cursor-hud" aria-hidden="true"><i></i><i></i><i></i><i></i><b></b><span class="scan"></span><span class="label"></span></div>
    {% set path = request.url.path %}
    <header class="site-header">
        <nav aria-label="Main">
            <a class="brand" href="/" {% if path == "/" %}aria-current="page"{% endif %}>
                <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
                    <circle cx="12" cy="12" r="5.5" fill="none" stroke="currentColor" stroke-width="2"/>
                    <circle cx="12" cy="12" r="1.8" fill="currentColor"/>
                </svg>
                Goal Tracker
            </a>
            <a class="nav-link" href="/goals" {% if path.startswith("/goals") %}aria-current="page"{% endif %}>Goals</a>
            <a class="nav-link" href="/week-plan" {% if path.startswith("/week-plan") %}aria-current="page"{% endif %}>Week plan</a>
            <a class="nav-link" href="/progress" {% if path.startswith("/progress") and path != "/progress/mail" %}aria-current="page"{% endif %}>Progress</a>
            <a class="nav-link" href="/summary" {% if path.startswith("/summary") %}aria-current="page"{% endif %}>Summary</a>
            <a class="nav-link" href="/reports" {% if path.startswith("/reports") %}aria-current="page"{% endif %}>Reports</a>
            <a class="mail-cta" href="/mail" data-magnetic {% if path.startswith("/mail") or path == "/progress/mail" %}aria-current="page"{% endif %}>
                <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="3" y="5" width="18" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/>
                    <path d="M4 7l8 6 8-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>Daily mail</span>
            </a>
            <button type="button" class="theme-toggle" data-theme-toggle aria-label="Switch to dark mode" title="Switch to dark mode">
                <svg class="sun" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/>
                    <path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <svg class="moon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                </svg>
            </button>
        </nav>
        <script>
            // Light/dark toggle; the choice is remembered in this browser.
            (() => {
                const root = document.documentElement;
                const button = document.querySelector("[data-theme-toggle]");
                const systemDark = matchMedia("(prefers-color-scheme: dark)");
                const isDark = () => root.dataset.theme ? root.dataset.theme === "dark" : systemDark.matches;
                const show = () => {
                    const dark = isDark();
                    button.classList.toggle("is-dark", dark);
                    const label = dark ? "Switch to light mode" : "Switch to dark mode";
                    button.setAttribute("aria-label", label);
                    button.title = label;
                };
                button.addEventListener("click", () => {
                    root.classList.add("theme-switching");
                    root.dataset.theme = isDark() ? "light" : "dark";
                    try { localStorage.setItem("gt-theme", root.dataset.theme); } catch {}
                    show();
                    setTimeout(() => root.classList.remove("theme-switching"), 400);
                });
                systemDark.addEventListener("change", show);
                show();
            })();
        </script>
    </header>

    <main class="{% block main_class %}{% endblock %}">
        {% block content %}{% endblock %}
    </main>

    {% include "_chat_widget.html" %}

    <footer class="site-footer">
        <span class="jai">Atharv ji ki Jai Ho !!</span>
    </footer>

    <script>
        // Slow AI requests: show progress on the clicked button and block double clicks.
        document.addEventListener("submit", (event) => {
            const button = event.submitter;
            if (!button || !button.dataset.busy) return;
            button.dataset.label = button.textContent;
            button.textContent = button.dataset.busy;
            setTimeout(() => { button.disabled = true; }, 0);
        });
        window.addEventListener("pageshow", () => {
            document.querySelectorAll("button[data-label]").forEach((button) => {
                button.textContent = button.dataset.label;
                button.disabled = false;
            });
        });
    </script>

    <script>
        // Motion: header shadow, scroll reveal, ripples and cursor tracking.
        (() => {
            const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
            const finePointer = matchMedia("(hover: hover) and (pointer: fine)").matches;
            const header = document.querySelector(".site-header");

            const onScroll = () => header.classList.toggle("scrolled", scrollY > 4);
            addEventListener("scroll", onScroll, { passive: true });
            onScroll();

            if (reduce) return;

            // Reveal cards as they scroll into view, slightly staggered.
            if ("IntersectionObserver" in window) {
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach((entry) => {
                        if (!entry.isIntersecting) return;
                        entry.target.classList.add("visible");
                        observer.unobserve(entry.target);
                    });
                }, { threshold: 0.05 });
                document.querySelectorAll("main .card, main form.panel, main .stat").forEach((element, index) => {
                    element.classList.add("reveal");
                    element.style.setProperty("--delay", `${Math.min(index, 6) * 0.06}s`);
                    observer.observe(element);
                });
            }

            // Ripple from the exact click point.
            document.addEventListener("pointerdown", (event) => {
                const target = event.target.closest("button, a.button, a.mail-cta");
                if (!target || target.disabled) return;
                const box = target.getBoundingClientRect();
                const ripple = document.createElement("span");
                ripple.className = "ripple";
                ripple.style.left = `${event.clientX - box.left}px`;
                ripple.style.top = `${event.clientY - box.top}px`;
                target.appendChild(ripple);
                ripple.addEventListener("animationend", () => ripple.remove());
            });

            if (!finePointer) return;

            const glow = document.querySelector(".cursor-glow");
            const hud = document.querySelector(".cursor-hud");
            const hudLabel = hud.querySelector(".label");
            const canvas = document.querySelector(".cursor-trail");
            const context = canvas.getContext("2d");
            const magnets = document.querySelectorAll("[data-magnetic]");
            const interactive = "a, button, input, select, textarea, summary, label, [role=button]";
            let x = innerWidth / 2, y = innerHeight / 2;
            let glowX = x, glowY = y;
            let target = null;                       // hovered element the HUD locks onto
            const box = { x: x - 14, y: y - 14, w: 28, h: 28 };
            const trail = [];                        // recent pointer positions
            const sparks = [];                       // small particles
            const waves = [];                        // click shockwaves

            const resize = () => {
                const ratio = devicePixelRatio || 1;
                canvas.width = innerWidth * ratio;
                canvas.height = innerHeight * ratio;
                context.setTransform(ratio, 0, 0, ratio, 0, 0);
            };
            addEventListener("resize", resize);
            resize();

            const labelFor = (element) => {
                if (!element) return "";
                const tag = element.tagName.toLowerCase();
                if (tag === "input" || tag === "textarea" || tag === "select") return "▸ INPUT";
                if (tag === "a") return "▸ LINK";
                return "▸ TARGET LOCKED";
            };

            document.addEventListener("pointermove", (event) => {
                x = event.clientX;
                y = event.clientY;
                document.body.classList.add("cursor-on");
                const hovered = event.target.closest(interactive);
                if (hovered !== target) {
                    target = hovered;
                    hudLabel.textContent = labelFor(target);
                }
                document.body.classList.toggle("cursor-hover", !!target);
                trail.push({ x, y, t: performance.now() });
                if (Math.random() < 0.25) {
                    sparks.push({ x, y, vx: (Math.random() - 0.5) * 1.4, vy: (Math.random() - 0.5) * 1.4, life: 1 });
                }

                // Spotlight position inside the hovered card.
                const card = event.target.closest(".card, form.panel, .stat");
                if (card) {
                    const box = card.getBoundingClientRect();
                    card.style.setProperty("--mx", `${x - box.left}px`);
                    card.style.setProperty("--my", `${y - box.top}px`);
                }

                // Magnetic Daily mail button: leans toward a nearby pointer.
                magnets.forEach((magnet) => {
                    const box = magnet.getBoundingClientRect();
                    const dx = x - (box.left + box.width / 2);
                    const dy = y - (box.top + box.height / 2);
                    magnet.style.transform = Math.hypot(dx, dy) < 110
                        ? `translate(${dx * 0.18}px, ${dy * 0.25}px)`
                        : "";
                });
            }, { passive: true });

            document.documentElement.addEventListener("mouseleave", () => document.body.classList.remove("cursor-on"));
            document.addEventListener("pointerdown", (event) => {
                document.body.classList.add("cursor-down");
                waves.push({ x: event.clientX, y: event.clientY, r: 4, life: 1 });
            });
            document.addEventListener("pointerup", () => document.body.classList.remove("cursor-down"));

            const hexagon = (cx, cy, r, rotation) => {
                context.beginPath();
                for (let i = 0; i < 6; i++) {
                    const angle = rotation + (Math.PI / 3) * i;
                    const px = cx + r * Math.cos(angle), py = cy + r * Math.sin(angle);
                    i ? context.lineTo(px, py) : context.moveTo(px, py);
                }
                context.closePath();
            };

            const frame = (now) => {
                // HUD brackets: small reticle on the pointer, or wrapped
                // around the hovered element like a target lock.
                let goal;
                if (target && target.isConnected) {
                    const rect = target.getBoundingClientRect();
                    goal = { x: rect.left - 6, y: rect.top - 6, w: rect.width + 12, h: rect.height + 12 };
                } else {
                    goal = { x: x - 14, y: y - 14, w: 28, h: 28 };
                }
                const ease = target ? 0.25 : 0.35;
                box.x += (goal.x - box.x) * ease;
                box.y += (goal.y - box.y) * ease;
                box.w += (goal.w - box.w) * ease;
                box.h += (goal.h - box.h) * ease;
                hud.style.transform = `translate(${box.x}px, ${box.y}px)`;
                hud.style.width = `${box.w}px`;
                hud.style.height = `${box.h}px`;

                glowX += (x - glowX) * 0.08;
                glowY += (y - glowY) * 0.08;
                glow.style.transform = `translate(${glowX}px, ${glowY}px)`;

                context.clearRect(0, 0, innerWidth, innerHeight);

                // Neon light trail: fades over 350 ms, cyan to violet.
                while (trail.length && now - trail[0].t > 350) trail.shift();
                for (let i = 1; i < trail.length; i++) {
                    const a = trail[i - 1], b = trail[i];
                    const age = 1 - (now - b.t) / 350;
                    context.strokeStyle = `hsla(${190 + (1 - age) * 90}, 100%, 60%, ${age * 0.9})`;
                    context.lineWidth = 1 + age * 3.5;
                    context.lineCap = "round";
                    context.shadowColor = "#00d5ff";
                    context.shadowBlur = 12 * age;
                    context.beginPath();
                    context.moveTo(a.x, a.y);
                    context.lineTo(b.x, b.y);
                    context.stroke();
                }

                // Sparks drifting off the trail.
                context.shadowBlur = 8;
                for (let i = sparks.length - 1; i >= 0; i--) {
                    const spark = sparks[i];
                    spark.x += spark.vx;
                    spark.y += spark.vy;
                    spark.life -= 0.03;
                    if (spark.life <= 0) { sparks.splice(i, 1); continue; }
                    context.fillStyle = `rgba(168, 85, 247, ${spark.life})`;
                    context.shadowColor = "#a855f7";
                    context.fillRect(spark.x - 1, spark.y - 1, 2, 2);
                }

                // Click shockwave: two expanding, rotating hexagons.
                for (let i = waves.length - 1; i >= 0; i--) {
                    const wave = waves[i];
                    wave.r += 2.6;
                    wave.life -= 0.035;
                    if (wave.life <= 0) { waves.splice(i, 1); continue; }
                    context.shadowColor = "#00d5ff";
                    context.shadowBlur = 14;
                    context.lineWidth = 2;
                    context.strokeStyle = `rgba(0, 213, 255, ${wave.life})`;
                    hexagon(wave.x, wave.y, wave.r, wave.r / 40);
                    context.stroke();
                    context.strokeStyle = `rgba(168, 85, 247, ${wave.life * 0.7})`;
                    hexagon(wave.x, wave.y, wave.r * 0.6, -wave.r / 30);
                    context.stroke();
                }
                context.shadowBlur = 0;

                requestAnimationFrame(frame);
            };
            requestAnimationFrame(frame);
        })();
    </script>
</body>
</html>
